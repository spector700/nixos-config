name: Prelude
on:
  workflow_call:
    inputs:
      command:
        required: false
        type: string
      platform:
        default: "ubuntu"
        required: false
        type: string
      optimize-space:
        default: true
        required: false
        type: boolean
    secrets:
      GH_TOKEN:
        required: true
permissions: {}
jobs:
  nix:
    runs-on: "${{ inputs.platform }}-latest"
    steps:
      - name: "Maximize build space"
        if: ${{ inputs.optimize-space }}
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          overprovision-lvm: true
          remove-android: true
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: "${{ secrets.GH_TOKEN }}"
      - name: Set up QEMU support
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Install Lix
        uses: DeterminateSystems/nix-installer-action@7993355175c2765e5733dae74f3e0786fe0e5c4f # v12
        with:
          source-url: "https://install.lix.systems/lix/lix-installer-x86_64-linux"
          diagnostic-endpoint: ""
          backtrace: "true"
          extra-conf: |
            # Extra experimental features. fetch-tree is required internally
            experimental-features = nix-command flakes fetch-tree
            allow-import-from-derivation = false
            extra-platforms = aarch64-linux

            # extra substituters
            # nix-community
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: "Nix Magic Cache"
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: "Install nix-fast-build"
        run: nix profile install nixpkgs#nix-fast-build

      - name: "Run Input: ${{ inputs.command }}"
        run: "${{ inputs.command }}"
